name: Build Radio Palavra Antiga 1.0.6 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/rpa106-nav-source.tar.xz.b64'
      - 'build-assets/debug-icon.png.b64'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/rpa106-nav-source.tar.xz.b64 > /tmp/rpa106-source.tar.xz
          echo '1a7d926325d2e85a52b8058fca218906225941a91b9cdd8845c72aaa9221a8ec  /tmp/rpa106-source.tar.xz' | sha256sum -c -
          mkdir -p app
          tar -xJf /tmp/rpa106-source.tar.xz -C app
          grep -q '^version: 1.0.6+7$' app/pubspec.yaml
          grep -q "label: 'Rádio'" app/lib/radio_webview.dart
          grep -q "label: 'Música'" app/lib/radio_webview.dart
          grep -q "label: 'WhatsApp'" app/lib/radio_webview.dart
          grep -q 'compileSdk = 36' app/android/app/build.gradle.kts
          grep -q 'permission_handler: \^12.0.1' app/pubspec.yaml
          grep -q 'id "com.android.library"$' app/packages/vehicle_connection_monitor/android/build.gradle

      - name: Restore debug image assets
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode build-assets/debug-icon.png.b64 > /tmp/rpa-debug-icon.png
          test -s /tmp/rpa-debug-icon.png
          file /tmp/rpa-debug-icon.png | grep -q 'PNG image data'
          mkdir -p app/assets/images
          cp /tmp/rpa-debug-icon.png app/assets/images/logo.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/android/app/src/main/res/mipmap-${density}"
            cp /tmp/rpa-debug-icon.png "app/android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          echo "flutter.sdk=${FLUTTER_ROOT}" > app/android/local.properties
          cd app/android
          gradle wrapper --gradle-version 9.5.0 --distribution-type all

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze source
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Run WebView bridge JavaScript tests
        working-directory: app
        run: node --test test/rpa_bridge_dom_test.js

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-debug.apk'
          test -s "${APK}"
          cp "${APK}" Radio-Palavra-Antiga-1.0.6-teste.apk
          unzip -t Radio-Palavra-Antiga-1.0.6-teste.apk >/dev/null
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          "${AAPT}" dump badging Radio-Palavra-Antiga-1.0.6-teste.apk | tee APK-INFO.txt
          grep -q "package: name='org.palavraantiga.radio.debug' versionCode='7' versionName='1.0.6-debug'" APK-INFO.txt
          sha256sum Radio-Palavra-Antiga-1.0.6-teste.apk | tee SHA256.txt
          ls -lh Radio-Palavra-Antiga-1.0.6-teste.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Palavra-Antiga-1.0.6-teste
          path: |
            Radio-Palavra-Antiga-1.0.6-teste.apk
            SHA256.txt
            APK-INFO.txt
          if-no-files-found: error
          retention-days: 14
