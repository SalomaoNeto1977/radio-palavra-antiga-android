name: Build Radio Palavra Antiga 1.0.10 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/rpa106-nav-source.tar.xz.b64'
      - 'build-assets/debug-icon.png.b64'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/rpa106-nav-source.tar.xz.b64 > /tmp/rpa110-source.tar.xz
          echo '6a7adde4ca780f0b105cffaa65ce6e09a43d70363291c06412edda96e3d9072a  /tmp/rpa110-source.tar.xz' | sha256sum -c -
          mkdir -p app
          tar -xJf /tmp/rpa110-source.tar.xz -C app
          grep -q '^version: 1.0.10+11$' app/pubspec.yaml
          grep -q "label: 'Rádio'" app/lib/radio_webview.dart
          grep -q "label: 'Música'" app/lib/radio_webview.dart
          grep -q "label: 'WhatsApp'" app/lib/radio_webview.dart
          grep -q 'official_playlists.json' app/pubspec.yaml
          grep -q "data-view='official'" app/web_integration/rpa_bridge.js
          grep -q '__RPA_UPDATE_OFFICIAL_PLAYLISTS' app/web_integration/rpa_bridge.js
          grep -q "🎙 Pedir" app/web_integration/rpa_bridge.js
          grep -q 'requestableSongsApi' app/lib/config/radio_config.dart
          grep -q 'OfficialPlaylistCatalogService' app/lib/radio_webview.dart
          grep -q 'AndroidAutoMediaLibrary.musicCategory' app/lib/radio_audio_handler.dart
          grep -q 'PlaybackSelection.onDemand' app/lib/radio_audio_handler.dart
          grep -q '__RPA_SET_ACTIVE' app/web_integration/rpa_bridge.js
          grep -q 'android:resource="@xml/automotive_app_desc"' app/android/app/src/main/AndroidManifest.xml
          if grep -q 'NAV_REQUESTS' app/web_integration/rpa_bridge.js; then
            echo '::error::A interface de pedidos não deve criar um quarto destino.'
            exit 1
          fi
          grep -q 'compileSdk = 36' app/android/app/build.gradle.kts
          grep -q 'permission_handler: \^12.0.1' app/pubspec.yaml
          grep -q 'id "com.android.library"$' app/packages/vehicle_connection_monitor/android/build.gradle

      - name: Restore debug image assets
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode build-assets/debug-icon.png.b64 > /tmp/rpa-debug-icon.png
          test -s /tmp/rpa-debug-icon.png
          file /tmp/rpa-debug-icon.png | grep -q 'PNG image data'
          mkdir -p app/assets/images
          cp /tmp/rpa-debug-icon.png app/assets/images/logo.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/android/app/src/main/res/mipmap-${density}"
            cp /tmp/rpa-debug-icon.png "app/android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      - name: Test playlist manifest generator
        working-directory: app
        run: python3 -m unittest discover -s test/python -p 'test_*.py' -v

      - name: Generate official AzuraCast playlist catalog
        shell: bash
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AZURACAST_API_KEY:-}" ]]; then
            echo '::error::O segredo AZURACAST_API_KEY não está configurado.'
            exit 1
          fi
          echo "::add-mask::${AZURACAST_API_KEY}"
          python3 app/tools/generate_playlist_manifest.py \
            --output app/assets/data/official_playlists.json
          test -s app/assets/data/official_playlists.json
          if grep -Fq -- "${AZURACAST_API_KEY}" app/assets/data/official_playlists.json; then
            echo '::error::O catálogo gerado contém dados que não devem ser publicados.'
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('app/assets/data/official_playlists.json').read_text(encoding='utf-8')
          )
          playlists = manifest.get('playlists', [])
          statistics = manifest.get('statistics', {})
          assert playlists, 'O catálogo oficial não contém playlists.'
          assert statistics.get('mapped_tracks', 0) > 0, 'Nenhuma música foi associada.'
          print(
              'Catálogo público validado:',
              len(playlists),
              'grupos e',
              statistics.get('public_tracks', 0),
              'músicas On-Demand.',
          )
          PY

      - name: Validate public AzuraCast request catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          endpoint = 'https://radio.palavraantiga.org/api/station/palavraantiga/requests'
          request = Request(
              endpoint,
              headers={
                  'Accept': 'application/json',
                  'User-Agent': 'RadioPalavraAntiga-Build/1.0',
              },
          )
          with urlopen(request, timeout=90) as response:
              payload = json.loads(response.read().decode('utf-8'))
          rows = payload if isinstance(payload, list) else payload.get('rows', [])
          valid = 0
          song_ids = set()
          for row in rows:
              if not isinstance(row, dict) or not isinstance(row.get('song'), dict):
                  continue
              request_id = str(row.get('request_id') or '').strip()
              song_id = str(row['song'].get('id') or '').strip()
              parsed = urlparse(urljoin(endpoint, str(row.get('request_url') or '')))
              if (
                  request_id
                  and song_id
                  and parsed.scheme == 'https'
                  and parsed.hostname == 'radio.palavraantiga.org'
                  and parsed.path.endswith('/request/' + request_id)
              ):
                  valid += 1
                  song_ids.add(song_id)
          assert valid > 0, 'O AzuraCast não devolveu pedidos públicos válidos.'
          print('Pedidos públicos validados:', valid, 'entradas e', len(song_ids), 'músicas.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          echo "flutter.sdk=${FLUTTER_ROOT}" > app/android/local.properties
          cd app/android
          gradle wrapper --gradle-version 9.5.0 --distribution-type all

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze source
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Run WebView bridge JavaScript tests
        working-directory: app
        run: node --test test/rpa_bridge_dom_test.js

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-debug.apk'
          test -s "${APK}"
          cp "${APK}" Radio-Palavra-Antiga-1.0.10-teste.apk
          unzip -t Radio-Palavra-Antiga-1.0.10-teste.apk >/dev/null
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          "${AAPT}" dump badging Radio-Palavra-Antiga-1.0.10-teste.apk | tee APK-INFO.txt
          grep -q "package: name='org.palavraantiga.radio.debug' versionCode='11' versionName='1.0.10-debug'" APK-INFO.txt
          sha256sum Radio-Palavra-Antiga-1.0.10-teste.apk | tee SHA256.txt
          ls -lh Radio-Palavra-Antiga-1.0.10-teste.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Palavra-Antiga-1.0.10-teste
          path: |
            Radio-Palavra-Antiga-1.0.10-teste.apk
            SHA256.txt
            APK-INFO.txt
          if-no-files-found: error
          retention-days: 14
