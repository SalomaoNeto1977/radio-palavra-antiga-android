name: Build Radio Palavra Antiga 1.0.6 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/**'
      - 'build-assets/**'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/source.part* > /tmp/rpa106-source.tar.xz
          echo '6913bb4ae795a9472c9f1c8b94dde3bc80fc49820496449e489bc029e9a030b4  /tmp/rpa106-source.tar.xz' | sha256sum -c -
          mkdir -p app
          tar -xJf /tmp/rpa106-source.tar.xz -C app
          grep -q '^version: 1.0.6+7$' app/pubspec.yaml
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/android/app/build.gradle.kts
          grep -q 'compileSdk = 36' app/android/app/build.gradle.kts

      - name: Apply verified 1.0.6 source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/lib/radio_audio_handler.dart')
          source = path.read_text()
          old_ctor = """class SharedPreferencesVehicleResumeStore implements VehicleResumeStore {\n  SharedPreferencesVehicleResumeStore({SharedPreferencesAsync? preferences})\n    : _preferences = preferences ?? SharedPreferencesAsync();\n"""
          new_ctor = """class SharedPreferencesVehicleResumeStore implements VehicleResumeStore {\n  SharedPreferencesVehicleResumeStore({SharedPreferencesAsync? preferences})\n    : _providedPreferences = preferences;\n"""
          old_field = """  final SharedPreferencesAsync _preferences;\n"""
          new_field = """  // Resolve platform preferences only when vehicle state is actually read/written.\n  // This keeps app startup and pure unit tests independent of platform storage.\n  final SharedPreferencesAsync? _providedPreferences;\n  SharedPreferencesAsync? _lazyPreferences;\n\n  SharedPreferencesAsync get _preferences =>\n      _providedPreferences ?? (_lazyPreferences ??= SharedPreferencesAsync());\n"""
          if old_ctor not in source or old_field not in source:
              raise SystemExit('Expected SharedPreferences source block not found')
          source = source.replace(old_ctor, new_ctor, 1).replace(old_field, new_field, 1)
          path.write_text(source)
          if '_preferences = preferences ?? SharedPreferencesAsync()' in source:
              raise SystemExit('Eager SharedPreferences construction still present')
          PY

      - name: Restore and verify test suite
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-assets/tests.tar.gz.b64 > /tmp/rpa106-tests.tar.gz
          echo 'ae69fb108a43a51045f8bfa21b3387619530b80e23939da6eb3cb2108c18aac8  /tmp/rpa106-tests.tar.gz' | sha256sum -c -
          tar -xzf /tmp/rpa106-tests.tar.gz -C app
          test -f app/test/webview_command_parser_test.dart
          test -f app/test/rpa_bridge_dom_test.js

      - name: Restore debug image assets
        shell: bash
        run: |
          set -euo pipefail
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9xkAAAAASUVORK5CYII=' | base64 -d > /tmp/rpa-placeholder.png
          mkdir -p app/assets/images
          cp /tmp/rpa-placeholder.png app/assets/images/logo.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/android/app/src/main/res/mipmap-$d"
            cp /tmp/rpa-placeholder.png "app/android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          echo "flutter.sdk=${FLUTTER_ROOT}" > app/android/local.properties
          cd app/android
          gradle wrapper --gradle-version 9.5.0 --distribution-type all

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze source
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Run WebView bridge JavaScript tests
        working-directory: app
        run: node test/rpa_bridge_dom_test.js

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$APK"
          cp "$APK" Radio-Palavra-Antiga-1.0.6-teste.apk
          unzip -t Radio-Palavra-Antiga-1.0.6-teste.apk >/dev/null
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging Radio-Palavra-Antiga-1.0.6-teste.apk | tee APK-INFO.txt
          grep -q "package: name='org.palavraantiga.radio.debug' versionCode='7' versionName='1.0.6-debug'" APK-INFO.txt
          sha256sum Radio-Palavra-Antiga-1.0.6-teste.apk | tee SHA256.txt
          ls -lh Radio-Palavra-Antiga-1.0.6-teste.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Palavra-Antiga-1.0.6-teste
          path: |
            Radio-Palavra-Antiga-1.0.6-teste.apk
            SHA256.txt
            APK-INFO.txt
          if-no-files-found: error
          retention-days: 14
