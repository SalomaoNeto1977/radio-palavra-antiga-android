name: Build Radio Palavra Antiga Google TV

on:
  workflow_dispatch:
  push:
    branches: [feature/google-tv-1.3.0]
    paths:
      - 'tv/**'
      - '.github/workflows/build-tv.yml'

permissions:
  contents: read

jobs:
  television:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Restore existing upload key
        env:
          RPA_UPLOAD_KEYSTORE_B64: ${{ secrets.RPA_UPLOAD_KEYSTORE_B64 }}
          RPA_UPLOAD_KEY_PASSWORD: ${{ secrets.RPA_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RPA_UPLOAD_KEYSTORE_B64}"
          test -n "${RPA_UPLOAD_KEY_PASSWORD}"
          printf '%s' "${RPA_UPLOAD_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/radio-upload.jks"
          keytool -list -keystore "${RUNNER_TEMP}/radio-upload.jks" -storepass:env RPA_UPLOAD_KEY_PASSWORD |
            grep -q 'A6:BD:E8:EC:C2:40:08:FD:FF:A1:8E:0A:6F:FA:D4:B6:15:D5:50:C7:68:21:73:98:BB:15:38:EC:67:DA:6C:57'
      - name: Test, inspect and build TV packages
        env:
          RPA_STORE_FILE: ${{ runner.temp }}/radio-upload.jks
          RPA_STORE_PASSWORD: ${{ secrets.RPA_UPLOAD_KEY_PASSWORD }}
          RPA_KEY_PASSWORD: ${{ secrets.RPA_UPLOAD_KEY_PASSWORD }}
          RPA_KEY_ALIAS: radio-palavra-antiga
        run: gradle -p tv --no-daemon --stacktrace testDebugUnitTest lintRelease assembleDebug assembleDebugAndroidTest bundleRelease
      - name: Verify TV manifest, signature and absence of native ABI restrictions
        shell: bash
        run: |
          set -euo pipefail
          APK=tv/app/build/outputs/apk/debug/app-debug.apk
          AAB=tv/app/build/outputs/bundle/release/app-release.aab
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump xmltree "${APK}" AndroidManifest.xml > tv-manifest.txt
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' tv-manifest.txt
          grep -q 'android.software.leanback' tv-manifest.txt
          grep -q 'android:banner' tv-manifest.txt
          if grep -E 'android.hardware.type.automotive|com.android.automotive|com.google.android.gms.car.application' tv-manifest.txt; then exit 1; fi
          if unzip -l "${AAB}" | grep -E '\.so$'; then echo 'Unexpected native library; audit 32/64-bit and 16 KB compatibility.'; exit 1; fi
          keytool -printcert -jarfile "${AAB}" |
            grep -q 'A6:BD:E8:EC:C2:40:08:FD:FF:A1:8E:0A:6F:FA:D4:B6:15:D5:50:C7:68:21:73:98:BB:15:38:EC:67:DA:6C:57'
          cp "${APK}" Radio-Palavra-Antiga-Google-TV-1.3.0-teste.apk
          cp "${AAB}" Radio-Palavra-Antiga-Google-TV-1.3.0-Play.aab
          sha256sum Radio-Palavra-Antiga-Google-TV-1.3.0-* > tv-SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Radio-Palavra-Antiga-Google-TV-1.3.0
          path: |
            Radio-Palavra-Antiga-Google-TV-1.3.0-teste.apk
            Radio-Palavra-Antiga-Google-TV-1.3.0-Play.aab
            tv-SHA256.txt
            tv-manifest.txt
            tv/app/build/reports/
            tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14

  tv-emulator:
    needs: television
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Radio-Palavra-Antiga-Google-TV-1.3.0
          path: packages
      - name: Allow this runner to use hardware acceleration
        run: sudo setfacl -m u:runner:rw /dev/kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Select an available official TV system image
        id: tv-image
        shell: bash
        run: |
          sdkmanager --list > sdk-packages.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          packages = set(re.findall(r'system-images;android-(\d+(?:-ext\d+)?);(google-tv|android-tv);(x86_64|x86)', Path('sdk-packages.txt').read_text()))
          candidates = [p for p in packages if 23 <= int(p[0].split('-')[0]) <= 36]
          if not candidates:
              raise RuntimeError('No compatible official TV image available')
          api, target, arch = max(candidates, key=lambda p: (p[1] == 'google-tv', int(p[0].split('-')[0]), p[2] == 'x86_64', p[0]))
          print('Selected official TV image:', api, target, arch)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'api={api.split("-")[0]}\nimage_api={api}\ntarget={target}\narch={arch}\n')
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.tv-image.outputs.api }}
          system-image-api-level: ${{ steps.tv-image.outputs.image_api }}
          target: ${{ steps.tv-image.outputs.target }}
          arch: ${{ steps.tv-image.outputs.arch }}
          profile: tv_1080p
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p tv-verification
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb install packages/Radio-Palavra-Antiga-Google-TV-1.3.0-teste.apk
            adb install packages/tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w org.palavraantiga.radio.tv.debug.test/androidx.test.runner.AndroidJUnitRunner | tee tv-verification/instrumentation.txt
            adb logcat -d -s ExoPlayerImplInternal:E AndroidRuntime:E > tv-verification/logcat.txt
            adb shell dumpsys media_session > tv-verification/media-session.txt
            mkdir -p tv-verification/screenshots
            for state in ready playing paused about; do adb exec-out run-as org.palavraantiga.radio.tv.debug cat files/tv-captures/${state}.png > tv-verification/screenshots/${state}.png || exit 1; done
            grep -q 'OK (1 test)' tv-verification/instrumentation.txt
            python3 tv/ci/collect-captures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Radio-Palavra-Antiga-Google-TV-verification
          path: tv-verification/
          retention-days: 14
