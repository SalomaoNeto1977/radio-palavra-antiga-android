<script>
(function () {
  'use strict';
  // O vinil pertence apenas à app Android. O PWA usa o leitor da página principal.
  const native = Boolean(window.RPA && typeof window.RPA.postMessage === 'function') ||
    /RadioPalavraAntiga\//.test(navigator.userAgent);
  if (!native || location.pathname.replace(/\/$/, '') !== '/app1') return;
  if (document.getElementById('rpaPlayerRoot')) return;
  const template = document.getElementById('rpaNativePlayerTemplate');
  if (template) template.parentNode.insertBefore(template.content.cloneNode(true), template);
})();
</script>
