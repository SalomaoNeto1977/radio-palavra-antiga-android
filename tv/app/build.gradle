plugins { id 'com.android.application' }

android {
    namespace 'org.palavraantiga.radio.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'org.palavraantiga.radio'
        minSdk 23
        targetSdk 36
        versionCode 1300001
        versionName '1.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def signingReady = ['RPA_STORE_FILE', 'RPA_STORE_PASSWORD', 'RPA_KEY_PASSWORD', 'RPA_KEY_ALIAS']
        .every { System.getenv(it) }
    if (signingReady) {
        signingConfigs {
            release {
                storeFile file(System.getenv('RPA_STORE_FILE'))
                storePassword System.getenv('RPA_STORE_PASSWORD')
                keyPassword System.getenv('RPA_KEY_PASSWORD')
                keyAlias System.getenv('RPA_KEY_ALIAS')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.tv.debug'; versionNameSuffix '-debug' }
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/station-res')
    testOptions { unitTests.includeAndroidResources = true }
}

def stationAssets = tasks.register('generateStationAssets') {
    def iconSource = file("${rootDir}/../build-assets/debug-icon.png.b64")
    def artworkSource = file("${rootDir}/../automotive/assets/station-artwork.jpg")
    def target = layout.buildDirectory.dir('generated/station-res')
    inputs.files iconSource, artworkSource
    outputs.dir target
    doLast {
        ['drawable-nodpi', 'raw'].each { directory ->
            def logo = new File(target.get().asFile, "${directory}/station_logo.png")
            logo.parentFile.mkdirs()
            logo.bytes = Base64.mimeDecoder.decode(iconSource.text)
            new File(target.get().asFile, "${directory}/station_artwork.jpg").bytes = artworkSource.bytes
        }
    }
}
tasks.named('preBuild').configure { dependsOn stationAssets }

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
